[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "upr"
version = "0.1.0"
description = "University Program (Margin) Review — program/major financial review for universities"
requires-python = ">=3.10"
dependencies = [
    "pydantic>=2.6",
    "pandas>=2.1",
    "PyYAML>=6.0",
    "python-dotenv>=1.0",
    "requests>=2.31",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.32", "plotly>=5.20"]
reporting = ["openpyxl>=3.1"]
jenzabar-sql = ["pyodbc>=5.0"]  # only for the Jenzabar direct-SQL path
dev = ["pytest>=8.0", "openpyxl>=3.1", "ruff>=0.6"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"upr.adapters" = ["*.csv"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests", "dashboard"]

[tool.ruff.lint]
select = ["E", "F", "I", "W", "UP"]
